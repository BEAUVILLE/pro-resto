<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>DIGIY RESTO PRO — Accès sécurisé</title>
  <meta name="description" content="Porte d'accès propriétaire DIGIY RESTO. Connexion sécurisée par e-mail / Magic Link."/>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet"/>
  <meta name="theme-color" content="#073f32"/>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f1e6;color:#073f32;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:480px;margin:20px;padding:28px;border:1px solid #d7dfd7;border-radius:22px;background:#fff;box-shadow:0 15px 38px #073f3220}
    h1{margin:0 0 10px;font-size:26px}p{margin:0 0 16px}
    a{display:inline-block;padding:12px 20px;border-radius:999px;background:#073f32;color:#fff;font-weight:800;text-decoration:none}
  </style>
  <script>
    (() => {
      'use strict';
      // L'ancienne porte PRO aboutit UNIQUEMENT à l'accès propriétaire réel.
      // L'authentification Magic Link et les droits restent gérés dans DIGIY RESTO.
      const destination = new URL('https://resto.digiylyfe.com/resa-resto/acces-proprietaire.html');
      const input = new URLSearchParams(window.location.search);
      const site = input.get('site');
      const lang = input.get('lang');
      // Préserver le restaurant demandé, sans l'inventer ni transférer de secrets.
      // La porte propriétaire valide ensuite le site autorisé.
      if (site && /^[a-z0-9-]{1,80}$/.test(site)) destination.searchParams.set('site', site);
      if (lang && ['fr','en','es','pt','de','it','nl','ar','wo','zh'].includes(lang)) {
        destination.searchParams.set('lang', lang);
      }
      window.location.replace(destination.href);
    })();
  </script>
</head>
<body>
  <main>
    <h1>🍽️ DIGIY RESTO PRO</h1>
    <p>Accès réservé aux propriétaires. Identifiez votre restaurant et recevez votre lien sécurisé par e-mail (Magic Link).</p>
    <p>Si la page ne s'ouvre pas automatiquement :</p>
    <a href="https://resto.digiylyfe.com/resa-resto/acces-proprietaire.html">Ouvrir l'accès sécurisé</a>
  </main>
</body>
</html>
